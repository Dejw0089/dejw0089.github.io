<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Packed Train | Yusuke Iwasaki</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/core/core.css?v=8">
<style>
  body { display: grid; place-items: center; text-align: center; user-select: none; -webkit-user-select: none; overflow: hidden; }
  #car { width: min(90vw, 400px); height: 220px; margin: 0 auto; border-radius: 16px; position: relative; touch-action: none;
         background: linear-gradient(#3d5a80, #293241); overflow: hidden; }
  #car::before { content: ''; position: absolute; left: 0; right: 0; top: 24px; height: 4px; background: #98c1d9; }
  #person { position: absolute; left: 50%; bottom: 10px; font-size: 80px; line-height: 1; translate: -50% 0; transform-origin: 50% 100%; }
  #time { font: 36px 'DotGothic16', monospace; color: #98c1d9; margin-top: 10px; }
  #start { margin-top: 8px; font: 800 20px 'M PLUS Rounded 1c', sans-serif; padding: 12px 30px; border-radius: 999px; border: none;
           background: #577590; color: #fff; cursor: pointer; }
  #start[hidden] { display: none; }
  #say { font-weight: 800; font-size: 16px; min-height: 2.6em; padding: 0 20px; margin-top: 10px; }
  #rec { color: var(--muted); font-family: 'DotGothic16', monospace; font-size: 14px; }
</style>
</head>
<body>
<div class="fz-bar"><a href="/" data-i18n="back"></a><span id="right"><span data-i18n="title"></span></span></div>
<div>
  <div id="car"><div id="person">🧍</div></div>
  <div id="time">0.0</div>
  <button id="start" data-i18n="start"></button>
  <div id="say" data-i18n="intro"></div>
  <div id="rec"></div>
</div>
<script src="/core/core.js?v=8"></script>
<script>
const APP = 'tsurikawa';
const FALL = 45;   // これ以上傾いたら倒れる（度）
const T = {
  en: {
    back: '← Back', title: 'Packed Train', start: 'Board the train',
    intro: 'The train sways. Move your finger left and right inside the car to stay upright. No straps left.',
    fell: s => 'You fell onto a stranger after ' + s + 's. Sumimasen.',
    rec: (b, t) => 'Best ' + b + 's / Total ' + t + 's',
  },
  ja: {
    back: '← 戻る', title: '満員電車', start: '乗車する',
    intro: '電車が揺れます。車内で指を左右に動かして、倒れないようにしてください。つり革は空いていません。',
    fell: s => s + '秒で知らない人に倒れかかりました。すみません。',
    rec: (b, t) => '最長 ' + b + '秒 / 合計 ' + t + '秒',
  },
};
let L = FZ.apply(T);
function setTitle() { document.title = L.title + ' | Yusuke Iwasaki'; }
setTitle();
FZ.langToggle(document.getElementById('right'));

const car = document.getElementById('car'), person = document.getElementById('person'), timeEl = document.getElementById('time');
const start = document.getElementById('start'), say = document.getElementById('say'), rec = document.getElementById('rec');
let running = false, t0 = 0, last = 0, angle = 0, omega = 0, gust = 0, push = 0, tick = null;
function show() { rec.textContent = L.rec(FZ.stat(APP, 'best'), Math.round(FZ.stat(APP, 'total') * 10) / 10); }
car.addEventListener('pointermove', e => {
  const r = car.getBoundingClientRect();
  const w = r.width || 400;
  push = Math.max(-1, Math.min(1, (e.clientX - (r.left + w / 2)) / (w / 2)));
});
start.onclick = () => {
  running = true;
  start.hidden = true;
  angle = 0; omega = 0; gust = 0; push = 0;
  t0 = last = performance.now();
  say.textContent = '';
  tick = setInterval(step, 50);
};
function step() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  gust += (Math.random() - 0.5) * 80 * dt;            // 電車の揺れ（だんだん溜まる）
  gust *= 0.98;
  omega += (angle * 1.2 + gust - push * 60) * dt;     // 傾いているほど倒れやすい。指で反対に踏ん張る
  omega *= 0.97;
  angle += omega * dt;
  person.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
  const s = (now - t0) / 1000;
  timeEl.textContent = s.toFixed(1);
  if (Math.abs(angle) > FALL) fall(s);
}
function fall(s) {
  clearInterval(tick);
  running = false;
  const v = Math.round(s * 10) / 10;
  FZ.max(APP, 'best', v);
  FZ.add(APP, 'total', v);
  say.textContent = L.fell(v);
  start.hidden = false;
  show();
}
show();
FZ.onLang(() => { L = T[FZ.lang()]; setTitle(); show(); });
</script>
</body>
</html>
