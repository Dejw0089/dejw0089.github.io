<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yusuke Iwasaki</title>
<meta name="description" content="Yusuke Iwasaki — PjM / PdM / PMO. Plus a gift of pure uselessness.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12101a">
<link rel="stylesheet" href="/core/core.css">
<style>
  main { max-width: 880px; margin: 0 auto; padding: 28px 16px 80px; }
  h1 { font-family: 'DotGothic16', monospace; font-size: clamp(40px, 9vw, 72px); margin: 8px 0 0; line-height: 1;
       color: #ffe066; text-shadow: 4px 4px 0 var(--accent); transform: rotate(-2deg); }
  .tag { color: var(--muted); margin: 14px 0 32px; }
  h2 { font-family: 'DotGothic16', monospace; font-size: 22px; margin: 40px 0 14px; }
  h2 small { color: var(--muted); font-size: 14px; margin-left: 8px; }

  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .app { display: block; text-decoration: none; background: var(--card); border-radius: 16px; padding: 18px;
         border: 3px solid transparent; transition: transform .15s; }
  .app:hover { transform: rotate(-1.5deg) scale(1.03); border-color: var(--c); }
  .app .emo { font-size: 44px; }
  .app .t { font-weight: 800; font-size: 20px; margin-top: 6px; color: var(--c); }
  .app .d { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .groove { background: var(--card); border-radius: 16px; padding: 18px; }
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .trk { border-radius: 12px; padding: 12px; border: 3px solid #3a3450; background: #15121f; text-align: left;
         color: var(--fg); font: inherit; cursor: pointer; min-height: 74px; }
  .trk .n { font-weight: 800; }
  .trk .h { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .trk.on { border-color: #ffe066; background: #2b2410; box-shadow: 0 0 18px #ffe06655; }
  .trk.locked { cursor: not-allowed; opacity: .55; }
  .trk.on .n::after { content: ' ♪'; }
  .playing .trk.on { animation: bump .5s infinite; }
  @keyframes bump { 50% { transform: scale(1.04); } }
  .btn { font: inherit; font-weight: 800; border: 3px solid var(--fg); background: none; color: var(--fg);
         padding: 8px 16px; border-radius: 10px; cursor: pointer; }
  .btn.big { background: #ffe066; color: #1b1030; border-color: #ffe066; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .count { color: var(--muted); font-family: 'DotGothic16', monospace; }

  details { background: var(--card); border-radius: 16px; padding: 14px 18px; }
  summary { cursor: pointer; font-weight: 800; }
  textarea { width: 100%; height: 70px; margin: 10px 0; background: #0c0a12; color: var(--fg); border: 2px solid #3a3450;
             border-radius: 8px; padding: 8px; font-family: monospace; font-size: 12px; }
  .note { color: var(--muted); font-size: 13px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; text-align: center; }

  /* 自己紹介 */
  .hero { padding: 40px 0 8px; }
  .who { font-size: clamp(36px, 8vw, 60px); line-height: 1.05; color: #ffe066; text-shadow: 4px 4px 0 var(--accent); }
  .role { font-weight: 800; font-size: 18px; margin-top: 12px; }
  .summary { color: var(--muted); line-height: 1.8; max-width: 640px; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .links a { text-decoration: none; font-weight: 800; padding: 10px 18px; border-radius: 999px;
             border: 3px solid var(--fg); transition: transform .15s; }
  .links a:hover { transform: rotate(-3deg) scale(1.05); background: var(--fg); color: var(--bg); }
  .career { list-style: none; padding: 0; margin: 0; border-left: 3px dashed #3a3450; }
  .career li { position: relative; padding: 0 0 18px 22px; }
  .career li::before { content: ''; position: absolute; left: -9px; top: 6px; width: 14px; height: 14px; border-radius: 50%;
                       background: var(--accent); }
  .career .when { font-family: 'DotGothic16', monospace; color: var(--muted); font-size: 13px; }
  .career .what { font-weight: 800; }
  .career .detail { color: var(--muted); font-size: 14px; margin-top: 2px; }

  /* お礼の箱 */
  .gift-wrap { text-align: center; margin: 60px 0 20px; }
  .gift-title { font-size: clamp(24px, 5vw, 34px); line-height: 1.4; }
  .giftbox { position: relative; width: 150px; height: 140px; border: none; background: none; cursor: pointer;
             animation: idle 2.4s infinite; }
  .giftbox .box { position: absolute; left: 15px; right: 15px; bottom: 0; height: 90px; background: var(--accent); border-radius: 6px; }
  .giftbox .lid { position: absolute; left: 5px; right: 5px; top: 22px; height: 30px; background: #ff7a93; border-radius: 6px;
                  z-index: 2; transition: transform .6s cubic-bezier(.3, 1.6, .5, 1); }
  .giftbox .ribbon { position: absolute; left: 66px; width: 18px; top: 22px; bottom: 0; background: #ffe066; z-index: 3; }
  .giftbox .label { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 4; color: #1b1030; font-size: 22px;
                    background: #ffe066; width: max-content; padding: 0 8px; margin: auto; border-radius: 6px; }
  .giftbox.open { animation: none; }
  .giftbox.open .lid, .giftbox.open .ribbon { transform: translate(40px, -90px) rotate(35deg); }
  .giftbox.open .ribbon { opacity: 0; transition: .4s; }
  @keyframes idle { 0%, 80%, 100% { rotate: 0deg; } 85% { rotate: -6deg; } 90% { rotate: 6deg; } 95% { rotate: -3deg; } }
  #gift { animation: drop .6s; }
  @keyframes drop { from { opacity: 0; transform: translateY(-20px); } }
</style>
</head>
<body>
<main>
  <!-- ===== 自己紹介（中身は /data/profile.json） ===== -->
  <section class="hero">
    <div class="who pixel" id="pname"></div>
    <div class="role" id="prole"></div>
    <p class="summary" id="psummary"></p>
    <div class="links" id="plinks"></div>
  </section>

  <h2><span data-i18n="career"></span> <small data-i18n="careerSub"></small></h2>
  <ol class="career" id="pcareer"></ol>

  <!-- ===== 訪問のお礼 ===== -->
  <section class="gift-wrap">
    <h2 class="gift-title" data-i18n-html="giftTitle"></h2>
    <button class="giftbox" id="giftbox">
      <span class="lid"></span><span class="box"></span><span class="ribbon"></span>
      <span class="label pixel" data-i18n="giftLabel"></span>
    </button>
    <p class="note" id="gifthint" data-i18n="giftHint"></p>
  </section>

  <div id="gift" hidden>
  <h1 data-i18n="boxName"></h1>
  <p class="tag" data-i18n="tagline"></p>

  <h2><span data-i18n="apps"></span> <small data-i18n="appsSub"></small></h2>
  <div class="apps" id="apps"></div>

  <h2><span data-i18n="groove"></span> <small id="count" class="count"></small></h2>
  <div class="groove" id="groove">
    <div class="row">
      <button class="btn big" id="play"></button>
      <span class="note" data-i18n="grooveNote"></span>
    </div>
    <div class="tracks" id="tracks"></div>
  </div>

  <h2><span data-i18n="save"></span> <small data-i18n="saveSub"></small></h2>
  <details>
    <summary data-i18n="saveSummary"></summary>
    <p class="note" data-i18n="saveNote"></p>
    <div class="row">
      <button class="btn" id="exp" data-i18n="exp"></button>
      <button class="btn" id="imp" data-i18n="imp"></button>
      <button class="btn" id="rst" data-i18n="rst"></button>
    </div>
    <textarea id="code"></textarea>
    <div class="note" id="msg"></div>
  </details>
  </div>

  <footer class="pixel" data-i18n="footer"></footer>
</main>

<script src="/core/core.js"></script>
<script>
const T = {
  en: {
    career: 'Career', careerSub: 'in short',
    giftTitle: 'As thanks for visiting,<br>please accept some uselessness.',
    giftLabel: 'USELESS', giftHint: 'Tap to receive (no returns)', giftAria: 'Receive the uselessness',
    giftOpened: 'Congratulations. It is useless.', giftAgain: 'Thanks for coming back. Still useless.',
    boxName: 'FUZAKE BOX',
    tagline: 'A button that does nothing, natto, and the void. Play them to collect sounds, which slowly turn into a groove.',
    apps: 'Apps', appsSub: 'none of them mean anything',
    groove: 'Groove Machine', sounds: 'sounds',
    grooveNote: 'Tap collected sounds to toggle them. Everything is 120 BPM, so it just fits.',
    play: '▶ Play', stop: '■ Stop', loading: '…loading', noSounds: 'No sounds yet. Go play the apps.',
    locked: '???',
    save: 'Save', saveSub: 'for moving devices or lost data',
    saveSummary: 'Show / load a save code',
    saveNote: 'Progress is stored in this browser. Safari on iPhone may delete it if you do not visit for a while, so add this page to your Home Screen or keep a save code somewhere.',
    exp: 'Show code', imp: 'Load this code', rst: 'Erase everything',
    codePh: 'Save code goes here', copied: 'Copy it and keep it somewhere.', loaded: 'Loaded.',
    confirmReset: 'All records and sounds will be erased. OK?',
    footer: 'FUZAKE BOX / 2026 / seriously made, not serious',
  },
  ja: {
    career: 'キャリア', careerSub: 'ざっくり',
    giftTitle: 'ご来訪のお礼に、<br>無駄をどうぞ。',
    giftLabel: '無駄', giftHint: 'タップして受け取る（返品不可）', giftAria: '無駄を受け取る',
    giftOpened: 'おめでとうございます。無駄です。', giftAgain: 'またのご来訪ありがとうございます。無駄です。',
    boxName: 'ふざけ箱',
    tagline: '押しても何も起きないボタン、納豆、虚無。遊ぶと音源がたまって、だんだんグルーヴになる。',
    apps: 'アプリ', appsSub: 'どれも意味はない',
    groove: 'グルーヴ機', sounds: '音源',
    grooveNote: '集めた音源をタップでON/OFF。全部120BPMで勝手に合う。',
    play: '▶ 鳴らす', stop: '■ 止める', loading: '…読み込み中', noSounds: 'まだ音源がない。アプリで遊べ',
    locked: '？？？',
    save: 'セーブ', saveSub: '引っ越し・消えたとき用',
    saveSummary: 'セーブコードを出す / 読み込む',
    saveNote: '進捗はこのブラウザに保存されます。iPhoneのSafariはしばらく開かないと消えることがあるので、ホーム画面に追加するか、たまにコードを控えておくと安心です。',
    exp: 'コードを出す', imp: 'このコードを読み込む', rst: '全部消す',
    codePh: 'ここにセーブコード', copied: 'コピーしてどこかに貼っておいてください。', loaded: '読み込みました。',
    confirmReset: '全部の記録と音源が消えます。いいですか？',
    footer: 'ふざけ箱 / 2026 / 真面目に作られた不真面目',
  },
};
const L = FZ.apply(T);
const t = FZ.t;
FZ.langToggle();
document.getElementById('giftbox').setAttribute('aria-label', L.giftAria);
document.getElementById('code').placeholder = L.codePh;

(async function () {
  // ---- 自己紹介 ----
  const p = await fetch('/data/profile.json').then(r => r.json());
  document.title = p.name + ' | ' + L.boxName;
  document.getElementById('pname').textContent = t(p.name);
  document.getElementById('prole').textContent = t(p.role);
  document.getElementById('psummary').textContent = t(p.summary);
  const linksEl = document.getElementById('plinks');
  for (const l of p.links.filter(l => l.url)) {
    const a = document.createElement('a');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t(l.label);
    linksEl.appendChild(a);
  }
  const careerEl = document.getElementById('pcareer');
  for (const c of p.career) {
    const li = document.createElement('li');
    li.innerHTML = '<div class="when"></div><div class="what"></div><div class="detail"></div>';
    li.querySelector('.when').textContent = t(c.when);
    li.querySelector('.what').textContent = t(c.what);
    li.querySelector('.detail').textContent = t(c.detail) || '';
    careerEl.appendChild(li);
  }

  // ---- お礼の箱：一度開けた人には最初から中身を見せる ----
  const giftEl = document.getElementById('gift'), box = document.getElementById('giftbox');
  function openGift(first) {
    box.classList.add('open');
    giftEl.hidden = false;
    document.getElementById('gifthint').textContent = first ? L.giftOpened : L.giftAgain;
    if (first) setTimeout(() => giftEl.scrollIntoView({ behavior: 'smooth' }), 500);
  }
  if (FZ.stat('top', 'gifts') > 0) openGift(false);
  box.onclick = () => { if (!box.classList.contains('open')) { FZ.add('top', 'gifts', 1); openGift(true); } };

  // ---- アプリ一覧 ----
  const apps = await fetch('/data/apps.json').then(r => r.json());
  const appsEl = document.getElementById('apps');
  for (const a of apps) {
    const el = document.createElement('a');
    el.className = 'app';
    el.href = '/apps/' + a.id + '/';
    el.style.setProperty('--c', a.color);
    el.innerHTML = '<div class="emo"></div><div class="t"></div><div class="d"></div>';
    el.querySelector('.emo').textContent = a.emoji;
    el.querySelector('.t').textContent = t(a.title);
    el.querySelector('.d').textContent = t(a.desc);
    appsEl.appendChild(el);
  }

  // ---- グルーヴ機 ----
  const rules = await FZ.rules();
  const unlocked = new Set(FZ.unlocked());
  document.getElementById('count').textContent = unlocked.size + ' / ' + rules.length + ' ' + L.sounds;

  const tracksEl = document.getElementById('tracks');
  const on = new Set([...unlocked]);  // 解放済みは最初から全部ON
  let ctx = null, buffers = {}, gains = {}, sources = [];

  for (const r of rules) {
    const b = document.createElement('button');
    const has = unlocked.has(r.id);
    b.className = 'trk' + (has ? ' on' : ' locked');
    b.innerHTML = '<div class="n"></div><div class="h"></div>';
    b.querySelector('.n').textContent = has ? t(r.name) : L.locked;
    b.querySelector('.h').textContent = has ? '' : t(r.hint);
    if (has) b.onclick = () => {
      on.has(r.id) ? on.delete(r.id) : on.add(r.id);
      b.classList.toggle('on', on.has(r.id));
      if (gains[r.id]) gains[r.id].gain.setTargetAtTime(on.has(r.id) ? 1 : 0, ctx.currentTime, 0.02);
    };
    tracksEl.appendChild(b);
  }

  const playBtn = document.getElementById('play');
  const groove = document.getElementById('groove');
  playBtn.textContent = L.play;
  playBtn.onclick = async () => {
    if (sources.length) { stop(); return; }
    if (!unlocked.size) { playBtn.textContent = L.noSounds; return; }
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    playBtn.textContent = L.loading;
    const list = rules.filter(r => unlocked.has(r.id));
    await Promise.all(list.map(async r => {
      if (!buffers[r.id]) {
        const ab = await fetch(r.file).then(x => x.arrayBuffer());
        buffers[r.id] = await ctx.decodeAudioData(ab);
      }
    }));
    const t0 = ctx.currentTime + 0.1;
    for (const r of list) {
      const src = ctx.createBufferSource();
      src.buffer = buffers[r.id];
      src.loop = true;
      const g = ctx.createGain();
      g.gain.value = on.has(r.id) ? 1 : 0;
      src.connect(g).connect(ctx.destination);
      src.start(t0);
      gains[r.id] = g;
      sources.push(src);
    }
    groove.classList.add('playing');
    playBtn.textContent = L.stop;
  };
  function stop() {
    sources.forEach(s => s.stop());
    sources = []; gains = {};
    groove.classList.remove('playing');
    playBtn.textContent = L.play;
  }

  // ---- セーブコード ----
  const code = document.getElementById('code'), msg = document.getElementById('msg');
  document.getElementById('exp').onclick = () => {
    code.value = FZ.exportCode();
    code.select();
    msg.textContent = L.copied;
  };
  document.getElementById('imp').onclick = () => {
    try { FZ.importCode(code.value); msg.textContent = L.loaded; setTimeout(() => location.reload(), 600); }
    catch (e) { msg.textContent = e.message; }
  };
  document.getElementById('rst').onclick = () => {
    if (confirm(L.confirmReset)) { FZ.reset(); location.reload(); }
  };
})();
</script>
</body>
</html>
